# ShopFlow / Business overview
# Orders, payments, refunds and stock reservations from the services' business metrics.
# Applied by `task cluster:dashboards`; reconciled into the ShopFlow Grafana by the Grafana
# operator (instance + folder + datasources: deploy/local/charts/shopflow-infra).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: shopflow-business
  namespace: shopflow
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: shopflow
spec:
  instanceSelector:
    matchLabels:
      grafana: shopflow
  folderRef: grafana-shopflow
  # Grafana's database is ephemeral; re-push often so a restarted pod is repopulated quickly.
  resyncPeriod: 1m
  json: |
    {
      "uid": "shopflow-business",
      "title": "ShopFlow / Business overview",
      "description": "Orders, payments, refunds and stock reservations from the services' business metrics.",
      "tags": [
        "shopflow"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Orders",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Orders",
          "description": "Orders processed in the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(shopflow_orders_total[$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "type": "stat",
