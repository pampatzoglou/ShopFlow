          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (topic) (rate(kafka_server_brokertopicmetrics_messagesinpersec_total{namespace=\"shopflow\", topic!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{topic}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(kafka_server_brokertopicmetrics_messagesinpersec_total{namespace=\"shopflow\", topic=\"\"}[$__rate_interval]))",
