{{- if .Values.kafkaUi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.kafkaUi.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shopflow-infra.labels" (dict "root" . "name" "kafka-ui" "component" "ui") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
