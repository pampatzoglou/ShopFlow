{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shopflow-infra.labels" (dict "root" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: tcp-postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "shopflow-infra.selectorLabels" (dict "root" . "name" "postgres" "component" "database") | nindent 4 }}
{{- end }}
