{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.serviceName }}-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shopflow-infra.labels" (dict "root" . "name" "postgres" "component" "database") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.auth.username | quote }}
  password: {{ .Values.postgres.auth.password | quote }}
{{- end }}
