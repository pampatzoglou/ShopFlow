{{- if .Values.kafka.enabled }}
{{- range .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ required "kafka.topics[].name is required" .name }}
  namespace: {{ $.Values.kafka.namespace }}
  labels:
    {{- include "shopflow-infra.labels" (dict "root" $ "name" "kafka" "component" "topic") | nindent 4 }}
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  partitions: {{ .partitions | default 1 }}
  replicas: {{ .replicas | default $.Values.kafka.replicas }}
  {{- with .config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
