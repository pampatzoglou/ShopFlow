apiVersion: v2
name: shopflow-infra
description: >-
  Everything the ShopFlow services need on the local cluster except Istio, as one release:
  monitoring (kube-prometheus-stack, Grafana operator, metrics-server), Kafka (Strimzi
  operator + cluster), PostgreSQL, Kafka UI, Grafana and the ingress Gateway. Install as
  release `shopflow-infra` in `kafka-system` (the Strimzi chart can't be moved out of the
  release namespace), after Istio.
type: application
version: 1.5.0
kubeVersion: ">=1.28.0-0"
maintainers:
  - name: shopflow-platform
dependencies:
  # Redirected to `monitoring` via namespaceOverride (values.yaml).
  - name: kube-prometheus-stack
    version: 93.4.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled
  - name: grafana-operator
    version: 5.26.0
    repository: oci://ghcr.io/grafana/helm-charts
    condition: grafana-operator.enabled
  # Resource metrics API (HPA, `kubectl top`); kind has no metrics-server of its own.
  # Redirected to kube-system via namespaceOverride.
  - name: metrics-server
    version: 3.14.0
    repository: https://kubernetes-sigs.github.io/metrics-server/
    condition: metrics-server.enabled
  # No namespace override: lives in the release namespace (kafka-system).
  - name: strimzi-kafka-operator
    version: 1.3.1
    repository: https://strimzi.io/charts/
    condition: strimzi-kafka-operator.enabled
