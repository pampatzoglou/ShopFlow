server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

# Actuator on its own port so /metrics is never reachable through the Service or the
# ingress gateway. Prometheus format at :9090/metrics (same path as the other services).
management:
  server:
    port: ${METRICS_PORT:9090}
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets, not client-side percentiles: aggregatable across pods in PromQL.
      percentiles-histogram:
        http.server.requests: true

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8081}
