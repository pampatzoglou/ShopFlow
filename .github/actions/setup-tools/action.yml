name: Setup tools
description: >-
  Install the pinned toolchain. Every version must satisfy its devbox.json constraint (named in
  the trailing comment); `task ci:versions` (part of `task lint`) fails on drift.

inputs:
  task:        { description: Install go-task,     default: "true" }
  python:      { description: Install Python,      default: "false" }
  yq:          { description: Install yq (go),     default: "false" }
  helm:        { description: Install helm,        default: "false" }
  kubectl:     { description: Install kubectl,     default: "false" }
  kind:        { description: Install kind,        default: "false" }
  istioctl:    { description: Install istioctl,    default: "false" }
  skaffold:    { description: Install skaffold,    default: "false" }
  kubeconform: { description: Install kubeconform, default: "false" }
  kubescape:   { description: Install kubescape,   default: "false" }
  hadolint:    { description: Install hadolint,    default: "false" }
  trivy:       { description: Install trivy,       default: "false" }
  k6:          { description: Install k6,          default: "false" }

runs:
  using: composite
  steps:
    # go-task is on by default — every job's entry point is `task <name>`.
    - name: Install go-task
      if: inputs.task == 'true'
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.53.1                 # devbox.json: go-task@3.53

    - name: Install Python
      if: inputs.python == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.12.16         # devbox.json: python@3.12

    - name: Install helm
      if: inputs.helm == 'true'
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.3.2                 # devbox.json: kubernetes-helm@4.3

    - name: Install kubectl
      if: inputs.kubectl == 'true'
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: v1.34.3                # devbox.json: kubectl@1.34

    # Tools with no maintained setup action: release binaries into a job-local bin dir on
    # PATH (no sudo, nothing written to system paths). Arch is detected, never hardcoded.
    # Each download is checked against a committed per-arch sha256, never the upstream sums
    # file: a release swapped after pinning fails here. `# Dockerfile: <ARG>` hashes are the
    # devcontainer image's own pins (pampatzoglou/devcontainer at the commit in its tag);
    # ci:versions checks they're identical. Bump a tool there first, then copy the hash here.
    - name: Prepare tool bin dir
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        case "$(uname -m)" in
          x86_64) echo "TOOL_ARCH=AMD64" >> "$GITHUB_ENV" ;;
          aarch64) echo "TOOL_ARCH=ARM64" >> "$GITHUB_ENV" ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        # fetch-verified <url> -> path of the download, checked against $SHA256_$TOOL_ARCH
        cat > "$RUNNER_TEMP/bin/fetch-verified" <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        var=SHA256_$TOOL_ARCH
        want=${!var:?"$var not set for this step"}
        out=$(mktemp -d)/${1##*/}
        curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --retry-all-errors \
          -o "$out" "$1"
        echo "$want  $out" | sha256sum -c --quiet - >&2
        echo "$out"
        EOF
        chmod +x "$RUNNER_TEMP/bin/fetch-verified"

    - name: Install yq
      if: inputs.yq == 'true'
      shell: bash
      env:
        VERSION: "4.54.1"               # devbox.json: yq-go@4.54
        SHA256_AMD64: "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f"  # Dockerfile: YQ_SHA256_AMD64
        SHA256_ARM64: "189088da0c6429ec5178dfaab1a114805f6cab0b61b165ab236efedf1d57a71b"  # Dockerfile: YQ_SHA256_ARM64
      run: |
        set -euo pipefail
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/mikefarah/yq/releases/download/v${VERSION}/yq_linux_${arch}")
        install -m755 "$f" "$RUNNER_TEMP/bin/yq"

    - name: Install kind
      if: inputs.kind == 'true'
      shell: bash
      env:
        VERSION: "0.33.0"               # devbox.json: kind@0.33
        SHA256_AMD64: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"  # Dockerfile: KIND_SHA256_AMD64
        SHA256_ARM64: "20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2"  # Dockerfile: KIND_SHA256_ARM64
      run: |
        set -euo pipefail
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/kubernetes-sigs/kind/releases/download/v${VERSION}/kind-linux-${arch}")
        install -m755 "$f" "$RUNNER_TEMP/bin/kind"

    - name: Install istioctl
      if: inputs.istioctl == 'true'
      shell: bash
      env:
        VERSION: "1.29.2"               # devbox.json: istioctl@1.29
        SHA256_AMD64: "e507d6396349b53dad4198c3c489a512535ce03d5950736cbf66758e91681290"  # Dockerfile: ISTIO_SHA256_AMD64
        SHA256_ARM64: "b83e4fde0f220de00926e3a7e8a4b579c38f08827791cf9d4ab57f04f0124de6"  # Dockerfile: ISTIO_SHA256_ARM64
      run: |
        set -euo pipefail
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/istio/istio/releases/download/${VERSION}/istioctl-${VERSION}-linux-${arch}.tar.gz")
        tar -xzf "$f" -C "$RUNNER_TEMP/bin" istioctl

    - name: Install skaffold
      if: inputs.skaffold == 'true'
      shell: bash
      env:
        VERSION: "2.25.0"               # devbox.json: skaffold@2.25
        SHA256_AMD64: "42b9e2e3246c19b78fcc53dd60cc7ded1da8704293886b909a2a02b9bef34d20"  # Dockerfile: SKAFFOLD_SHA256_AMD64
        SHA256_ARM64: "416f5fed2009c2b4adc62ae887ee5fc19ff08cc8a0250b81d8682d55626a75fd"  # Dockerfile: SKAFFOLD_SHA256_ARM64
      run: |
        set -euo pipefail
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/GoogleContainerTools/skaffold/releases/download/v${VERSION}/skaffold-linux-${arch}")
        install -m755 "$f" "$RUNNER_TEMP/bin/skaffold"

    - name: Install kubeconform
      if: inputs.kubeconform == 'true'
      shell: bash
      env:
        VERSION: "0.8.0"                # devbox.json: kubeconform@0.8
        SHA256_AMD64: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"  # Dockerfile: KUBECONFORM_SHA256_AMD64
        SHA256_ARM64: "1f53fc8e81258197a35e8603054162a5af1de8c5af13746c71ab680d9534ed87"  # Dockerfile: KUBECONFORM_SHA256_ARM64
      run: |
        set -euo pipefail
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-${arch}.tar.gz")
        tar -xzf "$f" -C "$RUNNER_TEMP/bin" kubeconform

    - name: Install kubescape
      if: inputs.kubescape == 'true'
      shell: bash
      env:
        VERSION: "4.0.20"               # devbox.json: kubescape@4.0
        SHA256_AMD64: "25649b3e1212a86bbd467d3e73812218459455c335fad7aaed7fe458782355c5"  # not in the devcontainer image
        SHA256_ARM64: "f50478243f9d1573cd37a4df68b9df3c8f66472d6016e837f059180198875991"  # not in the devcontainer image
      run: |
        set -euo pipefail
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/kubescape/kubescape/releases/download/v${VERSION}/kubescape_${VERSION}_linux_${arch}")
        install -m755 "$f" "$RUNNER_TEMP/bin/kubescape"

    - name: Install hadolint
      if: inputs.hadolint == 'true'
      shell: bash
      env:
        VERSION: "2.14.0"               # devbox.json: hadolint@2.14
        SHA256_AMD64: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"  # Dockerfile: HADOLINT_SHA256_AMD64
        SHA256_ARM64: "331f1d3511b84a4f1e3d18d52fec284723e4019552f4f47b19322a53ce9a40ed"  # Dockerfile: HADOLINT_SHA256_ARM64
      run: |
        set -euo pipefail
        # hadolint names its x86 build x86_64 rather than amd64.
        arch=$(uname -m | sed 's/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/hadolint-linux-${arch}")
        install -m755 "$f" "$RUNNER_TEMP/bin/hadolint"

    - name: Install trivy
      if: inputs.trivy == 'true'
      shell: bash
      env:
        VERSION: "0.76.2"               # devbox.json: trivy@0.76
        SHA256_AMD64: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"  # Dockerfile: TRIVY_SHA256_AMD64
        SHA256_ARM64: "ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3"  # Dockerfile: TRIVY_SHA256_ARM64
      run: |
        set -euo pipefail
        # trivy names its builds 64bit / ARM64.
        arch=$(uname -m | sed 's/x86_64/64bit/;s/aarch64/ARM64/')
        f=$(fetch-verified "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-${arch}.tar.gz")
        tar -xzf "$f" -C "$RUNNER_TEMP/bin" trivy

    - name: Install k6
      if: inputs.k6 == 'true'
      shell: bash
      env:
        VERSION: "2.4.0"                # devbox.json: k6@2.4
        SHA256_AMD64: "5a5ecf23529ccf93135bc7e5b0c1cd5126ecf5f2672e22eed1556a0ab74abb87"  # Dockerfile: K6_SHA256_AMD64
        SHA256_ARM64: "7bb415f59d81ad649a86f6da6b3e1bd2e4e64e84909deef13e9bca70608abccb"  # Dockerfile: K6_SHA256_ARM64
      run: |
        set -euo pipefail
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        f=$(fetch-verified "https://github.com/grafana/k6/releases/download/v${VERSION}/k6-v${VERSION}-linux-${arch}.tar.gz")
        tar -xzf "$f" -C "$RUNNER_TEMP/bin" --strip-components=1 "k6-v${VERSION}-linux-${arch}/k6"
