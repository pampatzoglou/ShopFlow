# Git hooks, installed on devbox shell entry (`pre-commit install` in devbox.json init_hook).
#   pre-commit run --all-files     # run everything manually
# Hook revs are commit SHAs (tags can be moved; a SHA cannot), the tag kept as a `# frozen:`
# comment. Dependabot (.github/dependabot.yaml, pre-commit ecosystem) bumps both,
# except hadolint, whose binary is pinned in devbox.json.
minimum_pre_commit_version: "4.0.0"

# Generated / vendored files: never rewrite them. transcripts/ are verbatim session logs.
exclude: ^(services/order-service/(gradlew(\.bat)?|gradle/wrapper/|build/)|transcripts/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
        # JSONC (comments allowed by the devcontainer spec).
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-yaml
        # skaffold.yaml and the k8s manifests are multi-document.
        args: [--allow-multiple-documents]
        # Helm templates are Go templates, not YAML, until rendered.
        exclude: ^deploy/(charts|local/charts)/[^/]+/templates/

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    # `hadolint` is the system-binary hook: it runs the devbox-pinned hadolint, the same one
    # `task lint` uses. Bump this rev together with hadolint@ in devbox.json.
    rev: 57e1618d78fd469a92c1e584e8c9313024656623  # frozen: v2.14.0
    hooks:
      - id: hadolint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --line-length=100]
      - id: ruff-format
        args: [--line-length=100]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        # direnv file without a shebang; editing it to add a directive forces `direnv allow`.
        exclude: ^\.envrc$
